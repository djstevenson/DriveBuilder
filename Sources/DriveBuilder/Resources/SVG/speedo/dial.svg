<svg viewBox="0 0 120 120" width="420" height="420" role="img">

    <circle cx="60" cy="60" r="50" fill="white" stroke="#333" stroke-width="8"/>

    <g stroke="#111" stroke-width="1" stroke-linecap="round">
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(-130 60 60)"/>
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(-97.5 60 60)"/>
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(-65 60 60)"/>
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(-32.5 60 60)"/>
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(0 60 60)"/>
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(32.5 60 60)"/>
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(65 60 60)"/>
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(97.5 60 60)"/>
        <line x1="60" y1="14" x2="60" y2="19" transform="rotate(130 60 60)"/>
    </g>

    <circle cx="60" cy="60" r="6"
        fill="#d8d8d8"
        stroke="#666"
        stroke-width="1.2"/>

    <circle cx="58" cy="58" r="2"
        fill="white"
        opacity="0.55"/>

    <!-- Speed labels, rendered last so they aren't overlapped. Each x/y is
         solved so the numeral's ink centre sits on the circle of radius 34
         at its tick's angle - the renderer ignores dominant-baseline and
         Helvetica's ink isn't centred on the anchor. -->
    <g fill="#111" font-family="Helvetica" font-size="9" font-weight="700" text-anchor="middle" dominant-baseline="middle">
        <text x="32.87" y="85.08">0</text>
        <text x="25.14" y="67.58">10</text>
        <text x="28.23" y="48.78">20</text>
        <text x="40.57" y="34.48">30</text>
        <text x="58.76" y="29.18">40</text>
        <text x="77.29" y="34.48">50</text>
        <text x="89.66" y="48.79">60</text>
        <text x="93.13" y="67.58">70</text>
        <text x="84.83" y="85.08">80</text>
    </g>

    <text x="58.61" y="90.13"
        font-family="Helvetica"
        font-weight="700"
        text-anchor="middle"
        font-size="9"
        fill="#111">
        mph
    </text>

</svg>
