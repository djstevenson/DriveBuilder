<svg viewBox="0 0 120 120" width="420" height="420" role="img">

    <circle cx="60" cy="60" r="50" fill="white" stroke="#333" stroke-width="8"/>

    <g stroke="#111" stroke-width="1" stroke-linecap="round">
        <line x1="60" y1="14" x2="60" y2="19"/>
        <line x1="60" y1="101" x2="60" y2="106" />
        <line x1="101" y1="60" x2="106" y2="60" />
        <line x1="14" y1="60" x2="19" y2="60" />
    </g>


    <g transform="rotate(0 60 60)">
        <circle cx="60" cy="60" r="6"
            fill="#d8d8d8"
            stroke="#666"
            stroke-width="1.2"/>

        <circle cx="58" cy="58" r="2"
            fill="white"/>

        <!-- x/y are solved so each letter's ink centre sits on the circle of
             radius 34, since the renderer ignores dominant-baseline and
             Transport's ink isn't centred on the anchor. -->
        <g fill="#111" font-family="Transport" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
            <text x="58.55"  y="30.85">N</text>
            <text x="58.50"  y="98.85">S</text>
            <text x="25.05"  y="64.83">W</text>
            <text x="92.30"  y="64.83">E</text>
        </g>
    </g>

</svg>
