<svg viewBox="0 0 120 120" width="420" height="420" role="img">

    <circle cx="60" cy="60" r="50" fill="white" stroke="#333" stroke-width="8"/>

    <g stroke="#111" stroke-linecap="round">
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(  0 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate( 30 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate( 60 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate( 90 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(120 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(150 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(180 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(210 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(240 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(270 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(300 60 60)"/>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(330 60 60)"/>
    </g>

    <!-- Hours (major only). The renderer ignores dominant-baseline and puts
         Transport's ink off-centre from the anchor, so each x/y below is
         solved so the numeral's *ink* centre lands on the dial circle of
         radius 34 - keeping all four an equal distance from their ticks. -->
    <g fill="#111" font-family="Transport" font-size="10" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(  0 60 60)"/>
        <text x="58.90" y="30.90">12</text>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate( 90 60 60)"/>
        <text x="92.80" y="64.83">3</text>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(180 60 60)"/>
        <text x="58.68" y="98.83">6</text>
        <line x1="60" y1="12" x2="60" y2="19" stroke-width="1.5" transform="rotate(270 60 60)"/>
        <text x="24.55" y="64.88">9</text>
    </g>

    <!-- hub -->
    <circle cx="60" cy="60" r="6" fill="#d8d8d8" stroke="#666" stroke-width="1.2"/>


</svg>
